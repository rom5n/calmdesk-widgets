id = "com.rom5n.quote-of-the-day-wide"
name = "Quote of the day"
variant = "Wide"
category = "Productivity"
engine = "^0.1"
size = [352, 170]
author = "rom5n"
version = "1.0.0"
icon = "assets/icon.svg"
homepage = "https://github.com/rom5n/calmdesk-widgets"

[card]
radius = 26
background = "frosted"
border = false
shadow = true

[font]
family = "Nunito"
weight = 400

[customize]
allow = ["size", "background", "theme", "font"]

[[source]]
key = "q"
url = "https://favqs.com/api/qotd"
json = "quote.body"
every = "3h"

[[source]]
key = "a"
url = "https://favqs.com/api/qotd"
json = "quote.author"
every = "3h"

[[source]]
key = "url"
url = "https://favqs.com/api/qotd"
json = "quote.url"
every = "3h"

